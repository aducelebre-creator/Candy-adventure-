<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff5b73">
<meta name="description" content="Candy Adventure — un jeu de puzzle coloré et gratuit.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Candy Adventure</title>
<style>
:root{--pink:#ff5577;--pink2:#ec3f68;--gold:#ffcf4a;--ink:#59233f;--cream:#fff8ed;--muted:#a66c78;--shadow:#a92f5940}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
body{background:radial-gradient(ellipse at 50% 0%,#ffe9a5 0,#ffb16f 38%,#ff7189 100%);padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);display:flex;justify-content:center;align-items:center;min-height:100dvh}
button{font:inherit;touch-action:manipulation}
.app{width:min(100%,480px);padding:15px 14px 18px;background:linear-gradient(180deg,#fffdf5,#ffeadb);border:4px solid #fff4d9;border-radius:30px;box-shadow:0 8px 0 #d84a6755,0 22px 50px #76274b44;position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.brand{display:flex;align-items:center;gap:9px}.brand-icon{width:43px;height:43px;border-radius:15px;background:linear-gradient(145deg,#ffdf6d,#ff9b42);display:grid;place-items:center;font-size:27px;box-shadow:inset 0 2px #fff9,0 3px #e5a04b}
.brand-name{font-size:18px;font-weight:1000;letter-spacing:-.6px;color:#ec456b;line-height:1}.brand-tag{font-size:10px;font-weight:800;color:#a66c78;letter-spacing:1.2px}
.iconbtn{border:0;background:#fff;border-radius:13px;width:42px;height:42px;font-size:19px;box-shadow:0 3px #efd4c7;cursor:pointer}
.hero{text-align:center;padding:4px 0 10px}.hero h1{font-size:clamp(31px,9vw,43px);line-height:1;margin:7px 0 4px;font-weight:1000;letter-spacing:-2px;color:#ff4f73;text-shadow:0 2px #fff,0 5px #ffc85a}
.hero p{margin:0;color:#a66c78;font-size:12px;font-weight:750}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stat{background:#fff;border-radius:15px;padding:8px 4px;text-align:center;box-shadow:0 3px #f0d1bd}.stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#b07b7e;font-weight:900}.stat strong{font-size:21px;font-weight:1000;color:#8f3155}
.goal{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#ffedb8;border:2px solid #ffdb78;border-radius:14px;padding:8px 11px;margin:9px 0 11px;font-size:12px;font-weight:900}
.progress{height:8px;border-radius:99px;background:#f6d7b4;overflow:hidden;flex:1;min-width:50px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a39,#ff4d79);border-radius:99px;transition:width .2s}
.board-wrap{position:relative;background:linear-gradient(145deg,#e98091,#cb5b7b);padding:6px;border-radius:19px;box-shadow:inset 0 3px 8px #77264a44,0 4px #b8496c}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;touch-action:manipulation}
.cell{aspect-ratio:1;border:0;border-radius:10px;background:#ffe3d8;display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:inset 0 -3px #d98b9855;min-width:0;transition:transform .1s}
.cell:active{transform:scale(.9)}.cell.selected{outline:3px solid #fff;box-shadow:0 0 0 3px #ffd34e;transform:scale(.94)}
.candy{width:77%;height:77%;border-radius:35% 42% 35% 42%;display:grid;place-items:center;font-size:clamp(15px,4.9vw,24px);filter:drop-shadow(0 3px 1px #7a294455);text-shadow:0 1px 2px #fff8}
.c0{background:linear-gradient(145deg,#ff9aad,#ef3970)}.c1{background:linear-gradient(145deg,#fff18a,#ffb51b)}.c2{background:linear-gradient(145deg,#a5f5bd,#24b978)}.c3{background:linear-gradient(145deg,#a6eaff,#278edc)}.c4{background:linear-gradient(145deg,#e3bdff,#9254df)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.action{border:0;border-radius:14px;padding:12px 8px;font-weight:950;font-size:13px;color:#fff;background:linear-gradient(#ff8b48,#ef4f65);box-shadow:0 4px #c6425d;cursor:pointer}
.action.alt{background:linear-gradient(#a787f4,#7049c5);box-shadow:0 4px #56379a}
.action:disabled{opacity:.5}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:13px;font-size:10px;color:#a66c78;font-weight:800}
.lives{background:#fff;border-radius:99px;padding:6px 10px;box-shadow:0 2px #efd4c7}
.overlay{position:absolute;inset:0;background:#54203dcc;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.dialog{background:var(--cream);border:4px solid var(--gold);border-radius:24px;padding:23px 19px;text-align:center;width:100%;box-shadow:0 9px #a94454}
.dialog .big{font-size:48px}.dialog h2{font-size:28px;margin:4px 0;color:#ed4c6d}.dialog p{font-weight:750;line-height:1.45;color:#8f5265;font-size:14px}
.dialog .action{width:100%;margin-top:8px}
.toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-10px);background:#5b2445;color:#fff;padding:9px 14px;border-radius:99px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.2s;z-index:4;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:700px){.app{padding:10px}.hero{padding:0 0 5px}.hero h1{font-size:32px}.stats{margin:5px 0}.goal{margin:6px 0 8px}.controls{margin-top:10px}.footer{margin-top:9px}}
</style>
</head>
<body>
<main class="app">
 <div class="top">
  <div class="brand"><div class="brand-icon">🍬</div><div><div class="brand-name">CANDY ADVENTURE</div><div class="brand-tag">MATCH • PLAY • HAVE FUN</div></div></div>
  <button class="iconbtn" id="sound" aria-label="Activer ou couper le son">🔊</button>
 </div>
 <section class="hero"><h1>Sweet Match!</h1><p>Échange les bonbons et réalise ton objectif.</p></section>
 <section class="stats">
  <div class="stat"><small>Niveau</small><strong id="level">1</strong></div>
  <div class="stat"><small>Score</small><strong id="score">0</strong></div>
  <div class="stat"><small>Coups</small><strong id="moves">25</strong></div>
 </section>
 <div class="goal"><span id="goaltext">⭐ Objectif : 500</span><div class="progress"><span id="progress"></span></div><span id="pct">0%</span></div>
 <div class="board-wrap"><div id="board" aria-label="Plateau de jeu"></div></div>
 <div class="controls"><button class="action" id="restart">↻ Recommencer</button><button class="action alt" id="hint">💡 Astuce</button></div>
 <div class="footer"><span class="lives" id="lives">❤️ 5 vies</span><span>Progression sauvegardée automatiquement</span></div>
 <div class="toast" id="toast"></div>
 <div class="overlay" id="overlay"><div class="dialog"><div class="big" id="big">🎉</div><h2 id="resultTitle">Bravo !</h2><p id="resultText"></p><button class="action" id="continue">Continuer</button></div></div>
</main>
<script>
(()=> {
const N=8,T=5,E=['🍓','🍋','🍏','🫐','🍇'],KEY='candyAdventureSaveV2';
let grid=[],selected=null,busy=false,score=0,moves=25,level=1,lives=5,sound=true,target=500;
try{let s=JSON.parse(localStorage.getItem(KEY)||'{}');score=s.score||0;level=s.level||1;lives=s.lives??5;}catch(e){}
target=500+(level-1)*250;
const $=id=>document.getElementById(id),board=$('board'),overlay=$('overlay');
function save(){try{localStorage.setItem(KEY,JSON.stringify({score,level,lives}));}catch(e){}}
function rand(){return Math.floor(Math.random()*T)}
function makeGrid(){grid=Array.from({length:N},()=>Array(N).fill(0));for(let r=0;r<N;r++)for(let c=0;c<N;c++){let v;do{v=rand()}while((c>1&&grid[r][c-1]===v&&grid[r][c-2]===v)||(r>1&&grid[r-1][c]===v&&grid[r-2][c]===v));grid[r][c]=v;}}
function draw(){board.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let b=document.createElement('button');b.className='cell'+(selected&&selected[0]===r&&selected[1]===c?' selected':'');b.innerHTML='<span class="candy c'+grid[r][c]+'">'+E[grid[r][c]]+'</span>';b.addEventListener('click',()=>tap(r,c));board.appendChild(b);}
$('level').textContent=level;$('score').textContent=score;$('moves').textContent=moves;$('goaltext').textContent='⭐ Objectif : '+target;let p=Math.min(100,Math.round(score/target*100));$('progress').style.width=p+'%';$('pct').textContent=p+'%';$('lives').textContent='❤️ '+lives+' vies';}
function matches(){let set=new Set();for(let r=0;r<N;r++){let st=0;for(let c=1;c<=N;c++){if(c<N&&grid[r][c]===grid[r][st])continue;if(c-st>=3)for(let k=st;k<c;k++)set.add(r+','+k);st=c;}}for(let c=0;c<N;c++){let st=0;for(let r=1;r<=N;r++){if(r<N&&grid[r][c]===grid[st][c])continue;if(r-st>=3)for(let k=st;k<r;k++)set.add(k+','+c);st=r;}}return [...set].map(x=>x.split(',').map(Number));}
function near(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1}
function swap(a,b){let v=grid[a[0]][a[1]];grid[a[0]][a[1]]=grid[b[0]][b[1]];grid[b[0]][b[1]]=v}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1200)}
async function resolve(){let combo=0;while(true){let m=matches();if(!m.length)break;combo++;score+=m.length*10*combo;m.forEach(([r,c])=>grid[r][c]=null);draw();await wait(110);for(let c=0;c<N;c++){let v=[];for(let r=N-1;r>=0;r--)if(grid[r][c]!==null)v.push(grid[r][c]);while(v.length<N)v.push(rand());for(let r=N-1,i=0;r>=0;r--,i++)grid[r][c]=v[i];}draw();await wait(110);}busy=false;save();endCheck();}
async function tap(r,c){if(busy)return;let p=[r,c];if(!selected){selected=p;draw();return}if(selected[0]===r&&selected[1]===c){selected=null;draw();return}if(!near(selected,p)){selected=p;draw();return}busy=true;let a=selected;selected=null;swap(a,p);draw();await wait(90);if(matches().length){moves--;await resolve()}else{swap(a,p);draw();busy=false;toast('Essaie un autre échange !')}}
function popup(icon,title,msg,mode){$('big').textContent=icon;$('resultTitle').textContent=title;$('resultText').textContent=msg;$('continue').textContent=mode==='win'?'Niveau suivant':'Rejouer';$('continue').onclick=()=>{overlay.style.display='none';if(mode==='win'){level++;target+=250;}else{if(lives>0)lives--;if(lives===0){lives=5;score=0;level=1;target=500;}}moves=25;selected=null;makeGrid();save();draw();};overlay.style.display='flex';}
function endCheck(){if(score>=target)popup('🏆','Niveau réussi !','Bravo ! Tu as atteint ton objectif.','win');else if(moves<=0)popup('💗','Partie terminée','Tu peux réessayer et battre ton meilleur score.','retry');}
$('restart').onclick=()=>{if(busy)return;score=0;moves=25;selected=null;makeGrid();save();draw();};
$('hint').onclick=()=>{if(busy)return;for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(let [dr,dc] of [[0,1],[1,0]]){let rr=r+dr,cc=c+dc;if(rr<N&&cc<N){swap([r,c],[rr,cc]);let ok=matches().length>0;swap([r,c],[rr,cc]);if(ok){selected=[r,c];draw();toast('Essaie ce bonbon !');setTimeout(()=>{selected=null;draw()},900);return}}}toast('Aucun coup trouvé')};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';toast(sound?'Son activé':'Son coupé');};
makeGrid();draw();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
